server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets com hash: cache longo, 404 de verdade se faltar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Estáticos ausentes -> 404 (nunca index.html).
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|json|woff|woff2|ttf|map)$ {
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota do app cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
